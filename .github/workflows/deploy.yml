name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'

concurrency:
  group: datamoney-production
  cancel-in-progress: false

jobs:
  deploy-pages:
    name: Deploy Static Site (Cloudflare Pages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install worker authentication dependencies
        run: npm ci --prefix workers --ignore-scripts --no-audit --no-fund

      - name: Test private comment security
        run: |
          node tests/private-comments.mjs
          node tests/article-feedback.mjs
          node tests/article-feedback-ui.mjs
          node tests/google-admin-auth.mjs
          node tests/google-admin-ui.mjs

      - name: Test keyboard back navigation
        run: node tests/back-navigation.mjs

      - name: Test investor survey
        run: |
          node tests/investor-survey.mjs
          node tests/investor-ui.mjs
          node tests/investor-embed-reload.mjs
          node tests/investor-email.mjs
          node tests/investor-reports.mjs
          node tests/investor-report-consent.mjs

      - name: Synchronize blog navigation
        run: python3 scripts/sync_blog_headers.py

      - name: Synchronize browser icons
        run: python3 scripts/sync_brand_icons.py

      - name: Build blog tag index
        run: |
          python3 scripts/build_blog_tags.py
          node tests/blog-tags.mjs

      - name: Synchronize blog sidebars
        run: python3 scripts/sync_blog_sidebars.py

      - name: Synchronize article thumbnails
        run: python3 scripts/sync_blog_thumbnails.py

      - name: Build article speech manifests
        run: python3 scripts/build_speech_manifests.py

      - name: Test local speech player
        run: node tests/article-local-speech-ui.mjs

      - name: Test shared speech pronunciation
        run: |
          node tests/speech-pronunciation-ui.mjs
          node tests/speech-device-language.mjs

      - name: Test article data and source excerpt format
        run: python3 -m unittest discover -s tests

      - name: Add article structured data
        run: python3 scripts/ensure_article_schema.py

      - name: Synchronize blog footers
        run: python3 scripts/sync_blog_footers.py

      - name: Build blog search index
        run: python3 scripts/build-search-index.py

      - name: Add site information and privacy links
        run: python3 scripts/ensure_site_info_links.py

      - name: Add Google Analytics to site pages
        run: python3 scripts/ensure_analytics.py

      - name: Add AdSense code to site pages
        run: python3 scripts/ensure_adsense.py

      - name: Synchronize site color theme
        run: python3 scripts/sync_theme.py

      - name: Test site color theme
        run: node tests/theme-ui.mjs

      - name: Refresh popular blog posts
        id: popular
        run: python3 scripts/update-popular-posts.py
        env:
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN || secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          DATAMONEY_INTERNAL_IPS: ${{ secrets.DATAMONEY_INTERNAL_IPS }}

      - name: Refresh AI referral traffic
        id: ai_traffic
        run: node scripts/update-ai-traffic.mjs
        env:
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}

      - name: Prepare worker secrets
        if: github.event_name != 'schedule'
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const names = ['RESEND_API_KEY', 'DM_GOOGLE_CLIENT_ID', 'DM_GOOGLE_ADMIN_EMAIL', 'DM_ADMIN_SESSION_SECRET', 'DM_GOOGLE_ENFORCE'];
          for (const name of names) if (!process.env[name]) throw new Error(`Missing worker secret: ${name}`);
          const values = Object.fromEntries(names.map(name => [name, process.env[name]]));
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/datamoney-worker-secrets.json`, JSON.stringify(values), {mode:0o600});
          NODE
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DM_GOOGLE_CLIENT_ID: ${{ secrets.DM_GOOGLE_CLIENT_ID }}
          DM_GOOGLE_ADMIN_EMAIL: ${{ secrets.DM_GOOGLE_ADMIN_EMAIL }}
          DM_ADMIN_SESSION_SECRET: ${{ secrets.DM_ADMIN_SESSION_SECRET }}
          DM_GOOGLE_ENFORCE: ${{ secrets.DM_GOOGLE_ENFORCE }}

      - name: Deploy Article Reactions and Comments
        if: github.event_name != 'schedule'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy --config wrangler.article-engagement.toml --secrets-file ${{ runner.temp }}/datamoney-worker-secrets.json

      - name: Exclude worker dependencies from static site
        run: |
          rm -rf workers/node_modules
          rm -f workers/investor-reports.js

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'schedule' || steps.popular.outputs.updated == 'true' || steps.ai_traffic.outputs.updated == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy . --project-name=datamoney-tools --branch=master

      - name: Restore IndexNow checkpoint
        if: github.event_name == 'push'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/datamoney-indexnow-last-commit
          key: datamoney-indexnow-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            datamoney-indexnow-v1-

      - name: Notify IndexNow of changed pages
        if: github.event_name == 'push'
        env:
          INDEXNOW_BEFORE: ${{ github.event.before }}
        run: |
          base="$INDEXNOW_BEFORE"
          checkpoint="$RUNNER_TEMP/datamoney-indexnow-last-commit"
          if [ -f "$checkpoint" ]; then base="$(cat "$checkpoint")"; fi
          if ! git merge-base --is-ancestor "$base" HEAD; then base="$INDEXNOW_BEFORE"; fi
          python3 scripts/notify_indexnow.py --before "$base" --after HEAD
          git rev-parse HEAD > "$checkpoint"

      - name: Save IndexNow checkpoint
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/datamoney-indexnow-last-commit
          key: datamoney-indexnow-v1-${{ github.run_id }}-${{ github.run_attempt }}
          
  deploy-worker:
    name: Deploy Redirect Worker
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy Worker
        run: wrangler deploy
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
