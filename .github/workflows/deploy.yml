name: Voice infrastructure read-only preflight
on:
  workflow_dispatch:
permissions: {}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Inspect Cloudflare access without changing settings
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          token = os.environ.get('CF_TOKEN', '')
          account = os.environ.get('CF_ACCOUNT', '')
          if not token or not account:
              print('missing Cloudflare token or account ID')
              raise SystemExit(0)
          def call(label, path):
              request = urllib.request.Request('https://api.cloudflare.com/client/v4' + path, headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/json'})
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      status, payload = response.status, json.load(response)
              except urllib.error.HTTPError as error:
                  status = error.code
                  try: payload = json.load(error)
                  except Exception: payload = {}
              except Exception as error:
                  print(json.dumps({'check': label, 'error_type': type(error).__name__}))
                  return None
              print(json.dumps({'check': label, 'status': status, 'success': payload.get('success'), 'error_codes': [item.get('code') for item in payload.get('errors', [])]}))
              return payload if payload.get('success') else None
          buckets = call('r2-list', '/accounts/' + account + '/r2/buckets?per_page=1')
          if buckets is not None:
              print(json.dumps({'check': 'r2-result', 'existing_bucket_visible': bool(buckets.get('result', {}).get('buckets', []))}))
          zones = call('zone-lookup', '/zones?name=datamoney.kr&status=active')
          if zones and zones.get('result'):
              zone = zones['result'][0]
              print(json.dumps({'check': 'zone-plan', 'plan': (zone.get('plan') or {}).get('name', 'unknown')}))
              zid = zone['id']
              dns = call('audio-dns-lookup', '/zones/' + zid + '/dns_records?name=audio.datamoney.kr')
              if dns is not None:
                  print(json.dumps({'check': 'audio-dns-result', 'records': len(dns.get('result', []))}))
              rules = call('rate-limit-read', '/zones/' + zid + '/rulesets/phases/http_ratelimit/entrypoint')
              if rules is not None:
                  print(json.dumps({'check': 'rate-limit-result', 'rules': len((rules.get('result') or {}).get('rules', []))}))
          PY
