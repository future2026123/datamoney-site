name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'

concurrency:
  group: datamoney-comment-permission-probe
  cancel-in-progress: false

jobs:
  check-comment-permissions:
    name: Check Turnstile API permissions
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Create comment protection widget
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.error, urllib.request
          prefix = 'https://api.cloudflare.com/client/v4/accounts/' + os.environ['CF_ACCOUNT_ID']
          headers = {'Authorization': 'Bearer ' + os.environ['CF_API_TOKEN'], 'Content-Type': 'application/json'}
          body = json.dumps({'name': 'DataMoney blog comment protection', 'domains': ['datamoney.kr'], 'mode': 'managed'}).encode()
          req = urllib.request.Request(prefix + '/challenges/widgets', data=body, headers=headers, method='POST')
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  data = json.load(response)
                  result = data['result']
                  secret, sitekey = result['secret'], result['sitekey']
                  print('::add-mask::' + secret)
                  print('Turnstile widget created for datamoney.kr; public sitekey:', sitekey)
                  for name, value in [('TURNSTILE_SECRET', secret), ('TURNSTILE_SITEKEY', sitekey)]:
                      payload = json.dumps({'name': name, 'text': value, 'type': 'secret_text'}).encode()
                      put = urllib.request.Request(prefix + '/workers/scripts/datamoney-article-engagement/secrets', data=payload, headers=headers, method='PUT')
                      with urllib.request.urlopen(put, timeout=20) as stored:
                          result = json.load(stored)
                          if not result.get('success'):
                              raise RuntimeError('Failed to store ' + name)
                      print('Worker binding stored:', name)
          except urllib.error.HTTPError as exc:
              data = json.load(exc)
              print('Turnstile setup: HTTP', exc.code, 'errors:', [(item.get('code'), item.get('message')) for item in data.get('errors', [])])
              sys.exit(1)
          PY

  deploy-pages:
    name: Deploy Static Site (Cloudflare Pages)
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Synchronize blog navigation
        run: python3 scripts/sync_blog_headers.py

      - name: Synchronize blog sidebars
        run: python3 scripts/sync_blog_sidebars.py

      - name: Build blog search index
        run: python3 scripts/build-search-index.py

      - name: Add site information and privacy links
        run: python3 scripts/ensure_site_info_links.py

      - name: Add AdSense code to site pages
        run: python3 scripts/ensure_adsense.py

      - name: Refresh popular blog posts
        id: popular
        run: python3 scripts/update-popular-posts.py
        env:
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN || secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Deploy Article Reactions and Comments
        if: github.event_name != 'schedule'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy --config wrangler.article-engagement.toml

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'schedule' || steps.popular.outputs.updated == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy . --project-name=datamoney-tools --branch=master

      - name: Restore IndexNow checkpoint
        if: github.event_name == 'push'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/datamoney-indexnow-last-commit
          key: datamoney-indexnow-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            datamoney-indexnow-v1-

      - name: Notify IndexNow of changed pages
        if: github.event_name == 'push'
        env:
          INDEXNOW_BEFORE: ${{ github.event.before }}
        run: |
          base="$INDEXNOW_BEFORE"
          checkpoint="$RUNNER_TEMP/datamoney-indexnow-last-commit"
          if [ -f "$checkpoint" ]; then base="$(cat "$checkpoint")"; fi
          if ! git merge-base --is-ancestor "$base" HEAD; then base="$INDEXNOW_BEFORE"; fi
          python3 scripts/notify_indexnow.py --before "$base" --after HEAD
          git rev-parse HEAD > "$checkpoint"

      - name: Save IndexNow checkpoint
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/datamoney-indexnow-last-commit
          key: datamoney-indexnow-v1-${{ github.run_id }}-${{ github.run_attempt }}
          
  deploy-worker:
    name: Deploy Redirect Worker
    if: github.event_name != 'schedule' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy Worker
        run: wrangler deploy
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
