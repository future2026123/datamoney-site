<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="icon" href="/favicon.ico?v=20261031-round">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png?v=20261031-round">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETF 수익률 계산기 | 데이터머니</title>
<meta name="description" content="ETF 적립식 투자 수익률을 직접 계산해보세요. 복리 효과, 원금, 수익금을 한눈에 확인.">
<link rel="canonical" href="https://datamoney.kr/tools/etf_calculator/">
<style>
  :root {
    --navy: #0F172A; --blue: #2563EB; --yellow: #FACC15;
    --green: #16A34A; --red: #DC2626; --text: #F8FAFC;
    --sub: #64748B; --bg: #F1F5F9; --card: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif; background: var(--bg); color: var(--navy); }

  header { background: var(--navy); padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; }
  header .logo { color: var(--text); font-size: 18px; font-weight: 700; text-decoration: none; }
  header .logo span { color: var(--blue); }

  .container { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
  .subtitle { color: var(--sub); font-size: 14px; margin-bottom: 28px; }

  .card { background: var(--card); border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .card h2 { font-size: 16px; font-weight: 600; margin-bottom: 20px; color: var(--navy); }

  .field { margin-bottom: 18px; }
  label { display: block; font-size: 13px; color: var(--sub); margin-bottom: 6px; font-weight: 500; }
  .input-wrap { position: relative; }
  input[type=number], input[data-amount], select {
    width: 100%; padding: 11px 14px; border: 1.5px solid #e2e8f0; border-radius: 8px;
    font-size: 15px; outline: none; transition: border-color .2s;
    background: #fff; color: var(--navy);
  }
  input[type=number]:focus, input[data-amount]:focus, select:focus { border-color: var(--blue); }
  .unit { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--sub); font-size: 13px; pointer-events: none; }

  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

  .btn-calc {
    width: 100%; padding: 15px; background: var(--blue); color: #fff;
    border: none; border-radius: 10px; font-size: 16px; font-weight: 700;
    cursor: pointer; transition: background .2s;
  }
  .btn-calc:hover { background: #1d4ed8; }

  /* 결과 */
  .result-card { background: var(--navy); border-radius: 12px; padding: 24px; color: var(--text); display: none; }
  .result-card.show { display: block; }
  .result-card h2 { font-size: 16px; color: var(--sub); margin-bottom: 20px; }
  .result-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
  .result-item { text-align: center; }
  .result-item .rlabel { font-size: 11px; color: var(--sub); margin-bottom: 4px; }
  .result-item .rvalue { font-size: 20px; font-weight: 700; }
  .result-item .rvalue.highlight { color: var(--yellow); }
  .result-item .rvalue.green { color: #4ade80; }

  /* 차트 */
  canvas { width: 100% !important; border-radius: 8px; }

  .table-wrap { overflow-x: auto; margin-top: 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: #1e293b; color: var(--sub); padding: 10px 12px; text-align: right; }
  th:first-child { text-align: left; }
  td { padding: 9px 12px; border-bottom: 1px solid #1e293b; color: #CBD5E1; text-align: right; }
  td:first-child { text-align: left; color: var(--sub); }

  @media (max-width: 500px) {
    .result-grid { grid-template-columns: 1fr 1fr; }
    .row-2 { grid-template-columns: 1fr; }
  }
</style>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6705155374292160" crossorigin="anonymous"></script>
<script src="/scripts/back-navigation.js?v=20261031-1" defer></script>
<link rel="stylesheet" href="/brand.css?v=20261031-round">
</head>
<body>

<header>
  <a class="logo" href="https://datamoney.kr"><img class="dm-inline-logo" src="/blog/datamoney-logo-display.png?v=20261031-round" width="28" height="28" alt="">데이터<span>머니</span></a>
  <span style="color:#64748B;font-size:13px">ETF 수익률 계산기</span>
</header>

<div class="container">
  <h1>ETF 적립식 수익률 계산기</h1>
  <p class="subtitle">매월 일정 금액을 ETF에 투자했을 때 복리 수익을 계산합니다</p>

  <div class="card">
    <h2>투자 조건 입력</h2>

    <div class="row-2">
      <div class="field">
        <label for="initial">초기 투자금</label>
        <div class="input-wrap">
          <input type="text" id="initial" value="10,000,000" inputmode="decimal" spellcheck="false" data-amount>
          <span class="unit">원</span>
        </div>
      </div>
      <div class="field">
        <label for="monthly">월 적립금</label>
        <div class="input-wrap">
          <input type="text" id="monthly" value="500,000" inputmode="decimal" spellcheck="false" data-amount>
          <span class="unit">원</span>
        </div>
      </div>
    </div>

    <div class="row-2">
      <div class="field">
        <label for="rate">연 기대 총수익률 (배당 포함·비용 차감 전)</label>
        <div class="input-wrap">
          <input type="number" id="rate" value="8" min="-99" max="100" step="0.1">
          <span class="unit">%</span>
        </div>
      </div>
      <div class="field">
        <label for="years">투자 기간</label>
        <div class="input-wrap">
          <input type="number" id="years" value="20" min="1" max="50" step="1">
          <span class="unit">년</span>
        </div>
      </div>
    </div>

    <div class="row-2">
      <div class="field"><label for="dividendYield">연 배당수익률 (총수익률에 포함)</label><div class="input-wrap"><input type="number" id="dividendYield" value="2" min="0" max="30" step="0.1"><span class="unit">%</span></div></div>
      <div class="field"><label for="dividendTax">배당 원천징수율</label><div class="input-wrap"><input type="number" id="dividendTax" value="0" min="0" max="100" step="0.1"><span class="unit">%</span></div></div>
    </div>
    <div class="row-2">
      <div class="field"><label for="fee">연간 비용률</label><div class="input-wrap"><input type="number" id="fee" value="0" min="0" max="10" step="0.01"><span class="unit">%</span></div></div>
      <div class="field"><label for="inflation">연 물가상승률 (현재 가치 비교)</label><div class="input-wrap"><input type="number" id="inflation" value="2" min="0" max="20" step="0.1"><span class="unit">%</span></div></div>
    </div>
    <div class="field">
      <label for="drip">배당 재투자 (DRIP)</label>
      <select id="drip">
        <option value="yes">포함 (자동 재투자)</option>
        <option value="no">미포함 (세후 배당금 현금 보유)</option>
      </select>
    </div>
    <div class="field">
      <label for="targetAmount">목표 자산 (선택)</label>
      <div class="input-wrap"><input type="text" id="targetAmount" value="" placeholder="목표를 입력하면 도달 시점을 보여드립니다" inputmode="decimal" spellcheck="false" data-amount><span class="unit">원</span></div>
    </div>

    <p style="font-size:12px;line-height:1.6;color:var(--sub);margin-bottom:16px">매월 초 납입하고 수익률·배당률·비용률을 12로 나눠 매월 일정하게 적용합니다. 배당세는 입력한 비율만 적용하며 매매차익 세금과 거래비용은 제외합니다.</p>
    <button class="btn-calc" onclick="if (calculate() !== false &amp;&amp; typeof window.gtag === 'function') window.gtag('event', 'calculator_result', {calculator_type: 'etf'});">수익률 계산하기</button>
    <p id="calcError" role="alert" style="color:#dc2626;font-size:13px;margin-top:10px"></p>
  </div>

  <!-- 결과 -->
  <div class="result-card" id="resultCard">
    <h2>계산 결과</h2>
    <div class="result-grid">
      <div class="result-item">
        <div class="rlabel">최종 자산</div>
        <div class="rvalue highlight" id="totalValue">—</div>
      </div>
      <div class="result-item">
        <div class="rlabel">총 납입 원금</div>
        <div class="rvalue" id="totalPrincipal">—</div>
      </div>
      <div class="result-item">
        <div class="rlabel">총 수익금</div>
        <div class="rvalue green" id="totalProfit">—</div>
      </div>
    </div>
    <p id="assumptions" style="color:#cbd5e1;font-size:13px;line-height:1.7;margin-bottom:18px"></p>
    <p id="targetStatus" style="color:#c9ddff;font-size:13px;line-height:1.7;margin-bottom:18px" hidden></p>
    <canvas id="chart"></canvas>
  </div>

  <!-- 연도별 상세 테이블 -->
  <div id="detailsSection" hidden>
    <div>
      <div class="card" style="background:#0F172A">
        <h2 style="color:#94A3B8">연도별 자산 변화</h2>
        <div class="table-wrap">
          <table id="yearlyTable"></table>
        </div>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script>
let chartInstance = null;

function fmt(n) {
  const sign = n < 0 ? '-' : '';
  n = Math.abs(n);
  if (n >= 1e8) return sign + (n / 1e8).toLocaleString("ko-KR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + "억";
  if (n >= 1e4) return sign + Math.round(n / 1e4).toLocaleString("ko-KR") + "만";
  return sign + Math.round(n).toLocaleString("ko-KR");
}

function calculate() {
  const initial = Number(document.getElementById("initial").value.replace(/,/g, ""));
  const monthly = Number(document.getElementById("monthly").value.replace(/,/g, ""));
  const rate    = Number(document.getElementById("rate").value) / 100;
  const years   = Number(document.getElementById("years").value);
  const yieldRate = Number(document.getElementById("dividendYield").value) / 100;
  const dividendTax = Number(document.getElementById("dividendTax").value) / 100;
  const fee = Number(document.getElementById("fee").value) / 100;
  const inflation = Number(document.getElementById("inflation").value) / 100;
  const reinvest = document.getElementById("drip").value === 'yes';
  const targetText = document.getElementById('targetAmount').value.replace(/,/g, '').trim();
  const target = targetText === '' ? null : Number(targetText);
  if (![initial,monthly,rate,years,yieldRate,dividendTax,fee,inflation].every(Number.isFinite) || initial<0 || monthly<0 || initial>1e15 || monthly>1e15 || (target!==null && (!Number.isFinite(target) || target<=0 || target>1e15)) || rate<-.99 || rate>1 || !Number.isInteger(years) || years<1 || years>50 || yieldRate<0 || yieldRate>.3 || dividendTax<0 || dividendTax>1 || fee<0 || fee>.1 || inflation<0 || inflation>.2) {
    document.getElementById('calcError').textContent='금액은 0~1,000조원(목표는 0 초과), 기간은 1~50년, 총수익률은 -99~100%, 배당률은 0~30%, 세율은 0~100%, 비용률은 0~10%, 물가상승률은 0~20%로 입력해 주세요.';
    document.getElementById('resultCard').classList.remove('show');document.getElementById('detailsSection').hidden=true;
    return false;
  }
  document.getElementById('calcError').textContent='';

  const months = years * 12;

  let value = initial;
  const labels = ["시작"];
  const values = [initial];
  const principals = [initial];
  let principal = initial;
  let cash = 0, taxPaid = 0;
  let targetMonth = target !== null && initial >= target ? 0 : null;
  const yearlyData = [];

  for (let m = 1; m <= months; m++) {
    const invested = value + monthly;
    const grossDividend = invested * yieldRate / 12;
    const tax = grossDividend * dividendTax;
    const netDividend = grossDividend - tax;
    value = invested * (1 + (rate - yieldRate - fee) / 12) + (reinvest ? netDividend : 0);
    if (!reinvest) cash += netDividend;
    taxPaid += tax;
    principal += monthly;
    if (target !== null && targetMonth === null && value + cash >= target) targetMonth = m;
    if (m % 12 === 0) {
      const yr = m / 12;
      const total = value + cash;
      labels.push(yr + "년");
      values.push(Math.round(total));
      principals.push(Math.round(principal));
      yearlyData.push({
        year: yr,
        total: Math.round(total),
        principal: Math.round(principal),
        profit: Math.round(total - principal),
        roi: (principal ? ((total / principal) - 1) * 100 : 0).toFixed(1),
      });
    }
  }

  const totalValue = Math.round(value + cash);
  const totalPrincipal = Math.round(principal);
  const totalProfit = totalValue - totalPrincipal;

  document.getElementById("totalValue").textContent = fmt(totalValue) + "원";
  document.getElementById("totalPrincipal").textContent = fmt(totalPrincipal) + "원";
  document.getElementById("totalProfit").textContent = (totalProfit > 0 ? "+" : "") + fmt(totalProfit) + "원";
  document.getElementById("totalProfit").style.color = totalProfit < 0 ? "#fb7185" : "#4ade80";
  const realValue = totalValue / Math.pow(1 + inflation, years);
  const exact = amount => Math.round(amount).toLocaleString('ko-KR')+'원';
  document.getElementById('assumptions').textContent = `최종 자산 정확 금액 ${exact(totalValue)} (평가액 ${exact(value)} + 배당 현금 ${exact(cash)}), 누적 수익 ${exact(totalProfit)}. 예상 배당 원천징수 ${exact(taxPaid)}. 물가상승률 ${inflation * 100}% 가정 시 현재 가치 약 ${exact(realValue)}입니다.`;
  const targetStatus=document.getElementById('targetStatus');
  targetStatus.hidden=target===null;
  if (target!==null) targetStatus.textContent=targetMonth===null ? `목표 ${exact(target)}에는 입력한 ${years}년 안에 도달하지 않았습니다.` : `목표 ${exact(target)}에 ${targetMonth===0?'시작 시점':`${targetMonth}개월차`}에 도달하는 가정입니다.`;

  const rc = document.getElementById("resultCard");
  rc.classList.add("show");

  document.getElementById("detailsSection").hidden = false;
  buildTable(yearlyData);

  // 차트 라이브러리를 불러오지 못해도 결과와 표는 사용할 수 있습니다.
  if (typeof Chart !== "function") {
    document.getElementById("chart").hidden = true;
    rc.scrollIntoView({ behavior: "smooth" });
    return;
  }
  document.getElementById("chart").hidden = false;
  if (chartInstance) chartInstance.destroy();
  const ctx = document.getElementById("chart").getContext("2d");
  chartInstance = new Chart(ctx, {
    type: "bar",
    data: {
      labels,
      datasets: [
        {
          label: "원금",
          data: principals,
          backgroundColor: "#2563EB",
          stack: "s",
        },
        {
          label: "수익",
          data: values.map((v, i) => v - principals[i]),
          backgroundColor: "#FACC15",
          stack: "s",
        },
      ],
    },
    options: {
      responsive: true,
      plugins: {
        legend: { labels: { color: "#94A3B8" } },
        tooltip: {
          callbacks: {
            label: ctx => ` ${ctx.dataset.label}: ${fmt(ctx.raw)}원`,
          },
        },
      },
      scales: {
        x: { ticks: { color: "#B6C4D7" }, grid: { color: "#334155" } },
        y: {
          ticks: { color: "#B6C4D7", callback: v => fmt(v) },
          grid: { color: "#334155" },
        },
      },
    },
  });

  rc.scrollIntoView({ behavior: "smooth" });
}

function buildTable(data) {
  const tbl = document.getElementById("yearlyTable");
  tbl.innerHTML = `
    <tr>
      <th style="text-align:left">연도</th>
      <th>총 자산</th>
      <th>납입 원금</th>
      <th>누적 수익</th>
      <th>수익률</th>
    </tr>
    ${data.map(r => `
    <tr>
      <td>${r.year}년차</td>
      <td>${fmt(r.total)}원</td>
      <td>${fmt(r.principal)}원</td>
      <td style="color:${r.profit < 0 ? '#fb7185' : '#4ade80'}">${r.profit > 0 ? '+' : ''}${fmt(r.profit)}원</td>
      <td style="color:#FACC15">${Number(r.roi) > 0 ? '+' : ''}${r.roi}%</td>
    </tr>`).join("")}
  `;
}
</script>
<script src="/scripts/format-amount.js?v=7384d129"></script>
</body>
</html>
